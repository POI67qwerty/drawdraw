<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>囲って塗るツール</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bar">
  <label class="btn">線画を開く<input id="file" type="file" accept="image/*" hidden></label>
  <button id="bFill" class="on">塗る</button>
  <button id="bErase">消す</button>
  <button id="bSplit">塗り分け</button>
  <select id="mode">
    <option value="trace">線画のエッジに沿って塗る/消す（隙間閉じ）</option>
    <option value="lasso">線画を無視してそのまま塗る/消す</option>
  </select>
  <input id="color" type="color" value="#f2b8a0">
  <label>隙間閉じ <input id="gap" type="range" min="0" max="30" value="8"><b id="gapv">8</b>px</label>
  <label>線の外へ <input id="ext" type="range" min="0" max="6" value="0"><b id="extv">0</b>px</label>
  <select id="smode"><option value="part">塗り分け：パーツ単位</option><option value="obj">塗り分け：オブジェクト単位（1つのまとまり＝1色）</option></select>
  <label>まとめ具合 <input id="minA" type="range" min="0" max="30" step="0.5" value="3"><b id="minav">3</b>%</label>
  <label>消しゴム <input id="esz" type="range" min="2" max="200" value="24"><b id="eszv">24</b>px</label>
</div>
<div class="bar">
  <button id="undo">元に戻す</button><button id="redo">やり直し</button><button id="bAll">全体を自動塗り分け</button><button id="clr">全部クリア</button>
  <button id="zo">－</button><span id="zl">100%</span><button id="zi">＋</button><button id="fit">全体</button>
  <button id="pan">移動</button>
  <label><input id="showL" type="checkbox" checked>線画</label>
  <label><input id="showF" type="checkbox" checked>塗り</label>
  <label><input id="chk" type="checkbox">市松背景</label>
  <label><input id="conv" type="checkbox" checked>白背景を透過化</label>
  <label><input id="useFill" type="checkbox" checked>塗り済みも隙間判定に含める</label>
  <span id="st"></span>
</div>
<div class="bar">
  <span style="color:var(--sub)">保存(PNG)</span>
  <button data-s="0,0,_fill_alpha">塗りのみ（透過）</button>
  <button data-s="0,1,_fill_white">塗りのみ（白背景）</button>
  <button data-s="1,0,_art_alpha">線画あり（透過）</button>
  <button data-s="1,1,_art_white">線画あり（白背景）</button>
</div>
<div id="wrap">
  <p id="hint">「線画を開く」で線画の画像を読み込んでください。塗りたい所を指やペンでぐるっと囲うと塗れます。</p>
  <div id="stack" hidden>
    <canvas id="fill"></canvas><canvas id="line"></canvas><canvas id="ov"></canvas>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
